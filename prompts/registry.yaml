audit_log:
  # Append-only deployment and rollback events.
  # This log is the durable record of what ran in production and when.
  - event: deployed
    prompt_name: system
    version: "1.0.0"
    actor: deploy-bot
    timestamp: "2025-01-15T08:00:00Z"
    proposal_id: null
    notes: "Initial seed deployment."

  - event: deployed
    prompt_name: system
    version: "1.1.0"
    actor: deploy-bot
    timestamp: "2025-03-16T09:00:00Z"
    proposal_id: prop-2025-001
    notes: "Deployed to 100% of traffic during low-usage window."
